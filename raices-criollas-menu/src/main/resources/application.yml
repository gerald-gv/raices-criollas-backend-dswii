server:
  port: 8082

spring:
  application:
    name: raices-criollas-menu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menu_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:YOUR_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:      
        "[format_sql]": true
  messages:
    basename: validaciones
eureka:
  instance:
    hostname: "${EUREKA_HOSTNAME:localhost}"
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"

app:
  jwt:
    issuer: auth-service
    access-token-minutes: 120
    secret: ${JWT_SECRET}
