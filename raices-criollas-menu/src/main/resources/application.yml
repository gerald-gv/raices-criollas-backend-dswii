server:
  port: 8082

spring:
  application:
    name: raices-criollas-menu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menu_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:YOUR_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: validaciones

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  jwt:
    issuer: auth-service
    access-token-minutes: 120
    secret: ${JWT_SECRET}