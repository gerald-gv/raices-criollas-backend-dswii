server:
  port: 8081

spring:
  application:
    name: raices-criollas-auth
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/auth_db}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:YOUR_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

app:
  jwt:
    issuer: auth-service
    access-token-minutes: 120
    secret: "${JWT_SECRET}"

eureka:
  instance:
    hostname: "${EUREKA_HOSTNAME:localhost}"
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"
