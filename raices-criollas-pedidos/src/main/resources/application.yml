server:
  port: 8084
spring:
  application:
    name: raices-criollas-pedidos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    secret: ${INTERNAL_SECRET:antiCibertec}
  expiracion:
    pedido-pendiente-minutos: 30
    carrito-dias: 1
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

