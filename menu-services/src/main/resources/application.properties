spring.application.name=menu-services
server.port=8082
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/menu_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:TU_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.messages.basename=validaciones
app.jwt.issuer=auth-service
app.jwt.access-token-minutes=120
app.jwt.secret=${JWT_SECRET}