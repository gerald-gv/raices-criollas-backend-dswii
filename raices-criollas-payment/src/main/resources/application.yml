server:
  port: 8085

spring:
  application:
    name: raices-criollas-payment
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/payment_db}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:YOUR_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

app:
  jwt:
    secret: "${JWT_SECRET}"
  internal:
    secret: "${INTERNAL_SECRET:antiCibertec}"
  mercadopago:
    access-token: "${MP_ACCESS_TOKEN}"
    frontend-url: "${FRONTEND_URL:http://localhost:4200}"
    public-url: "${MP_PUBLIC_URL:}"
eureka:
  instance:
    hostname: "${EUREKA_HOSTNAME:localhost}"
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"