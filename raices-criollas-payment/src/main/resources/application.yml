server:
  port: 8085

spring:
  application:
    name: raices-criollas-payment
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/payment_db}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:YOUR_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

app:
  sync:
    activo: ${SYNC_ACTIVO:true}
    intervalo-ms: ${SYNC_INTERVALO_MS:30000}
    ventana-minutos: ${SYNC_VENTANA_MINUTOS:35}
  pedidos:
    vigencia-minutos: ${PEDIDO_VIGENCIA_MINUTOS:3}
    zona-horaria: ${PEDIDO_ZONA_HORARIA:America/Lima}
  jwt:
    secret: "${JWT_SECRET}"
  internal:
    secret: "${INTERNAL_SECRET}"
  mercadopago:
    access-token: "${MP_ACCESS_TOKEN}"
    frontend-url: "${FRONTEND_URL:http://localhost:3000}"
    public-url: "${MP_PUBLIC_URL:}"
eureka:
  instance:
    hostname: "${EUREKA_HOSTNAME:localhost}"
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"