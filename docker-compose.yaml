
services:
  postgres-auth:
    image: postgres:18
    container_name: raices-criollas-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
      - ./dbInit/auth_db.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-menu:
    image: postgres:18
    container_name: raices-criollas-postgres-menu
    restart: unless-stopped
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5434:5432"
    volumes:
      - menu_postgres_data:/var/lib/postgresql
      - ./dbInit/menu_db.sql:/docker-entrypoint-initdb.d/01-menu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: raices-criollas-rabbitmq
    hostname: rabbit-host
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-raices_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  menu:
    build:
      context: ./raices-criollas-menu
      dockerfile: Dockerfile
    container_name: raices-criollas-menu
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-menu:5432/menu_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka
      EUREKA_HOSTNAME: raices-criollas-menu
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-raices_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres-menu:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started

  eureka:
    build:
      context: ./raices-criollas-eureka
      dockerfile: Dockerfile
    container_name: raices-criollas-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"

  auth:
    build:
      context: ./raices-criollas-auth
      dockerfile: Dockerfile
    container_name: raices-criollas-auth
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      EUREKA_URL: http://eureka:8761/eureka
      EUREKA_HOSTNAME: raices-criollas-auth
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka:
        condition: service_started

  gateway:
    build:
      context: ./raices-criollas-gateway
      dockerfile: Dockerfile
    container_name: raices-criollas-gateway
    restart: unless-stopped
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      EUREKA_HOSTNAME: raices-criollas-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - auth

  postgres-pedidos:
    image: postgres:18
    container_name: raices-criollas-postgres-pedidos
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pedidos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pedidos:
    build:
      context: ./raices-criollas-pedidos
      dockerfile: Dockerfile
    container_name: raices-criollas-pedidos
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-pedidos:5432/pedidos_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka
      EUREKA_HOSTNAME: raices-criollas-pedidos
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-raices_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-pedidos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started


volumes:
  auth_postgres_data:
  menu_postgres_data:
  rabbitmq_data:
  pedidos_postgres_data: